name: Validate shader library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: static (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.15'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test bootstrap failures and skill discovery
        run: |
          python3 -I -m unittest discover -s tests -v
          python3 -I tools/check_skill_links.py
      - name: Prepare the locked portable checker
        id: checker
        run: python3 -I tools/checker_bootstrap.py prepare --github-output "$GITHUB_OUTPUT"
      - name: Validate assets, templates, provenance and CPU profiles
        env:
          CHECKER_ARTIFACT: ${{ steps.checker.outputs.artifactPath }}
        run: python3 -I "$CHECKER_ARTIFACT" validate "$GITHUB_WORKSPACE" --json
      - name: Fetch tests from the checker's exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.checker.outputs.repository }}
          ref: ${{ steps.checker.outputs.sourceCommit }}
          path: .cache/checker-source
          persist-credentials: false
      - name: Require artifact and source correspondence before running tests
        env:
          CHECKER_ARTIFACT: ${{ steps.checker.outputs.artifactPath }}
        run: python3 -I tools/checker_bootstrap.py verify-source --source "$GITHUB_WORKSPACE/.cache/checker-source" --artifact "$CHECKER_ARTIFACT"
      - name: Require CPU unit, library and license integration tests
        working-directory: .cache/checker-source
        env:
          HOLODECK_LIBRARY_ROOT: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -B tools/run_tests.py
      - name: Require source to remain verified after tests
        env:
          CHECKER_ARTIFACT: ${{ steps.checker.outputs.artifactPath }}
        run: python3 -I tools/checker_bootstrap.py verify-source --source "$GITHUB_WORKSPACE/.cache/checker-source" --artifact "$CHECKER_ARTIFACT"
