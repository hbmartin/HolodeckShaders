name: Validate shader library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify the pinned portable checker
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 --output "$RUNNER_TEMP/shader-checker.pyz" https://github.com/hbmartin/HolodeckShaderCheck/releases/download/v1.0.2/holodeck-shader-check-1.0.2.pyz
          printf '%s  %s\n' '5f04194022ecf63965f8ef717e2857fa14c00f88bef59449489033ecf7ab5615' "$RUNNER_TEMP/shader-checker.pyz" | sha256sum --check
      - name: Validate all assets, provenance and CPU profiles
        run: python3 -I "$RUNNER_TEMP/shader-checker.pyz" validate "$GITHUB_WORKSPACE" --json
  compile:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch pinned native tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hbmartin/Holodeck
          ref: 7e7f92b47f340aa9d386e97152a4602df637a69b
          path: .cache/holodeck-tooling
          persist-credentials: false
      - name: Install the Metal compiler component
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build the bundled CLI and compile every shader and example for macOS and tvOS
        run: |
          swift build --package-path .cache/holodeck-tooling/HolodeckCore -c release --product holodeck-shader-tool --force-resolved-versions
          task_shader_tool_bin=$(swift build --package-path .cache/holodeck-tooling/HolodeckCore -c release --show-bin-path --force-resolved-versions)
          "$task_shader_tool_bin/holodeck-shader-tool" library validate "$GITHUB_WORKSPACE" --compile --json
